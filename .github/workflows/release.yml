name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') {
            throw "Tag '$tag' is not a supported release version. Use v1.2.3 or v1.2.3-rc.1."
          }

          $version = $Matches['version']
          $coreVersion = $version.Split('-')[0]
          $prerelease = $version.Contains('-').ToString().ToLowerInvariant()
          "product=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "file=$coreVersion.0" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "Release version: $version"

      - name: Restore
        run: dotnet restore KeepAlive.sln

      - name: Build
        run: >-
          dotnet build KeepAlive.sln --configuration Release --no-restore
          -p:Version=${{ steps.version.outputs.product }}
          -p:FileVersion=${{ steps.version.outputs.file }}

      - name: Test
        run: dotnet test KeepAlive.sln --configuration Release --no-build

      - name: Package portable Windows build
        shell: pwsh
        run: ./build/Publish.ps1 -Version '${{ steps.version.outputs.product }}'

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = '${{ steps.version.outputs.product }}'
          $archive = "artifacts/releases/KeepAlive-$version-win-x64.zip"
          $checksum = "$archive.sha256"
          $arguments = @(
            'release', 'create', $tag, $archive, $checksum,
            '--verify-tag', '--generate-notes', '--title', "Keep Alive $version"
          )

          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') {
            $arguments += '--prerelease'
            $arguments += '--latest=false'
          }
          else {
            $arguments += '--latest'
          }

          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
