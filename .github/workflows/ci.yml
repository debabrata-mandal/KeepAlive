name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore KeepAlive.sln

      - name: Build
        run: dotnet build KeepAlive.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test KeepAlive.sln --configuration Release --no-build

  publish-package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.3

      - name: Resolve build version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'src/KeepAlive/KeepAlive.csproj'
          $baseVersion = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($baseVersion)) { throw 'The project version is missing.' }

          $buildVersion = "$baseVersion-ci.${{ github.run_number }}"
          "value=$buildVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "Build version: $buildVersion"

      - name: Package portable Windows build
        shell: pwsh
        run: ./build/Publish.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Publish package to GHCR
        shell: pwsh
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $package = 'ghcr.io/${{ github.repository }}'.ToLowerInvariant()
          $archive = "artifacts/releases/KeepAlive-$version-win-x64.zip"
          $checksum = "$archive.sha256"

          $env:GHCR_TOKEN | oras login ghcr.io --username '${{ github.actor }}' --password-stdin
          if ($LASTEXITCODE -ne 0) { throw 'GHCR login failed.' }

          oras push "${package}:$version" `
            --artifact-type 'application/vnd.keepalive.release.v1' `
            --annotation 'org.opencontainers.image.source=https://github.com/${{ github.repository }}' `
            --annotation 'org.opencontainers.image.revision=${{ github.sha }}' `
            "${archive}:application/zip" `
            "${checksum}:text/plain"
          if ($LASTEXITCODE -ne 0) { throw 'GHCR publish failed.' }
