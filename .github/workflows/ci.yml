name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: keep-alive-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_and_test:
    runs-on: windows-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      should_release: ${{ steps.version.outputs.should_release }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore KeepAlive.sln

      - name: Resolve build version
        id: version
        shell: pwsh
        run: |
          $result = ./build/Resolve-Version.ps1 -BuildNumber ${{ github.run_number }} | ConvertFrom-Json
          "product=$($result.BuildVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "file=$($result.FileVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_version=$($result.ReleaseVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "should_release=$($result.ShouldRelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "Build version: $($result.BuildVersion); bump: $($result.Bump)"

      - name: Build
        run: >-
          dotnet build KeepAlive.sln --configuration Release --no-restore
          -p:Version=${{ steps.version.outputs.product }}
          -p:FileVersion=${{ steps.version.outputs.file }}

      - name: Test
        run: dotnet test KeepAlive.sln --configuration Release --no-build

  publish_release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build_and_test.outputs.should_release == 'true'
    needs: build_and_test
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Package portable Windows build
        shell: pwsh
        run: ./build/Publish.ps1 -Version '${{ needs.build_and_test.outputs.release_version }}'

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ needs.build_and_test.outputs.release_version }}'
          $tag = "v$version"
          $archive = "artifacts/releases/KeepAlive-$version-win-x64.zip"
          $checksum = "$archive.sha256"

          gh release create $tag $archive $checksum `
            --target '${{ github.sha }}' `
            --generate-notes `
            --latest `
            --title "Keep Alive $version"

          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }

      - name: Remove older releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ needs.build_and_test.outputs.release_version }}"
          $releases = gh release list --limit 1000 --json tagName | ConvertFrom-Json

          foreach ($release in $releases) {
              if ($release.tagName -eq $tag) {
                  continue
              }

              Write-Output "Deleting older release $($release.tagName)"
              gh release delete $release.tagName --yes

              if ($LASTEXITCODE -ne 0) { throw "Failed to delete release $($release.tagName)." }
          }
