name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore KeepAlive.sln

      - name: Build
        run: dotnet build KeepAlive.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test KeepAlive.sln --configuration Release --no-build
