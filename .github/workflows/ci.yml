name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore KeepAlive.sln

      - name: Resolve build version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'src/KeepAlive/KeepAlive.csproj'
          $baseVersion = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($baseVersion)) { throw 'The project version is missing.' }

          $coreVersion = $baseVersion.Split('-')[0]
          $productVersion = "$baseVersion-ci.${{ github.run_number }}"
          $fileVersion = "$coreVersion.${{ github.run_number }}"
          "product=$productVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "file=$fileVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "Build version: $productVersion"

      - name: Build
        run: >-
          dotnet build KeepAlive.sln --configuration Release --no-restore
          -p:Version=${{ steps.version.outputs.product }}
          -p:FileVersion=${{ steps.version.outputs.file }}

      - name: Test
        run: dotnet test KeepAlive.sln --configuration Release --no-build
